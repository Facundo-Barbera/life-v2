# Linked with `supabase link`. Do not put secrets in this file.
# After creating the hosted project, add `life` and `pulso` to the
# exposed API schemas in the dashboard (Settings → API).

[api]
enabled = true
port = 54321
schemas = ["public", "life", "pulso"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = false

[auth]
enabled = true

# Sign-up by invitation only: life.before_user_created rejects e-mails without
# an open row in life.invitations (the first account of an empty project is the
# owner). On the hosted project enable the same hook in Authentication → Hooks.
[auth.hook.before_user_created]
enabled = true
uri = "pg-functions://postgres/life/before_user_created"
